<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0F5E63"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="290" y1="256" x2="386" y2="256">
      <stop offset="0" stop-color="#A8DADC"/>
      <stop offset="1" stop-color="#F4E9CD"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- three dashed "text lines" flowing in from the left, braiding into one stream -->
  <g fill="none" stroke-linecap="round">
    <path d="M 72 168 C 180 168, 220 238, 296 250"
          stroke="#7FD8BE" stroke-width="24" stroke-dasharray="36 24" opacity="0.95"/>
    <path d="M 72 256 C 160 256, 220 256, 296 256"
          stroke="#A8DADC" stroke-width="24" stroke-dasharray="54 22" opacity="0.95"/>
    <path d="M 72 344 C 180 344, 220 274, 296 262"
          stroke="#F4E9CD" stroke-width="24" stroke-dasharray="28 20" opacity="0.95"/>
    <!-- the merged flow: one solid stream running into the arrowhead -->
    <path d="M 290 256 L 386 256" stroke="url(#flow)" stroke-width="40"/>
  </g>

  <!-- solid arrowhead, joined to the stream -->
  <path d="M 368 200 L 456 256 L 368 312 C 384 292, 390 272, 390 256 C 390 240, 384 220, 368 200 Z"
        fill="#F4E9CD"/>
</svg>
